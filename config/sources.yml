# Odyssey source registry. license_status: verified = license confirmed; verify = check before publishing any data.
sources:
  - {id: wikidata,               name: Wikidata,                   feeds: [countries, destinations, unesco, dishes, festivals], method: sparql,          cadence: weekly,    phase: 1, license: CC0,          license_status: verified, url: "https://query.wikidata.org"}
  - {id: worldbank_indicators,   name: World Bank Indicators,      feeds: [arrivals, receipts, price_levels],                 method: rest_api,        cadence: yearly,    phase: 1, license: CC BY 4.0,    license_status: verified, url: "https://api.worldbank.org/v2"}
  - {id: un_tourism,             name: UN Tourism statistics,      feeds: [arrivals_by_origin, spending],                     method: bulk_download,   cadence: yearly,    phase: 1, license: TBD,          license_status: verify,   url: null}
  - {id: travel_advisories,      name: Government travel advisories, feeds: [advisory_levels],                               method: rest_api_rss,    cadence: daily,     phase: 1, license: TBD,          license_status: verify,   url: null}
  - {id: ecb_fx,                 name: ECB exchange rates,         feeds: [fx_rates],                                         method: rest_api,        cadence: daily,     phase: 1, license: ECB reuse terms, license_status: verify, url: "https://data.ecb.europa.eu"}
  - {id: public_holidays,        name: Nager.Date public holidays, feeds: [holidays],                                         method: rest_api,        cadence: yearly,    phase: 1, license: TBD,          license_status: verify,   url: "https://date.nager.at"}
  - {id: visa_matrix,            name: Passport index dataset,     feeds: [visa_requirements],                                method: git_pull,        cadence: monthly,   phase: 1, license: TBD,          license_status: verify,   url: null}
  - {id: overture_places,        name: Overture Maps Places,       feeds: [places],                                           method: duckdb_bbox,     cadence: monthly,   phase: 2, license: CDLA-Permissive-2.0, license_status: verify, url: "https://docs.overturemaps.org"}
  - {id: osm,                    name: OpenStreetMap,              feeds: [places, cuisine_tags],                             method: pbf_extract,     cadence: weekly,    phase: 2, license: ODbL,         license_status: verified, url: "https://download.geofabrik.de"}
  - {id: foursquare_os_places,   name: Foursquare Open Source Places, feeds: [places, categories],                            method: bulk_parquet,    cadence: monthly,   phase: 2, license: Apache-2.0,   license_status: verify,   url: null}
  - {id: wikivoyage,             name: Wikivoyage,                 feeds: [guide_text, culture_cards],                        method: dump_parse,      cadence: monthly,   phase: 3, license: CC BY-SA,     license_status: verified, url: "https://dumps.wikimedia.org"}
  - {id: osm_hiking_routes,      name: OSM hiking routes,          feeds: [treks],                                            method: pbf_extract,     cadence: weekly,    phase: 3, license: ODbL,         license_status: verified, url: "https://hiking.waymarkedtrails.org"}
  - {id: wikipedia_pageviews,    name: Wikipedia pageviews,        feeds: [interest, crowd_seasonality],                      method: rest_api,        cadence: daily,     phase: 4, license: CC0,          license_status: verify,   url: "https://wikimedia.org/api/rest_v1"}
  - {id: aurora_climate,         name: Aurora climate gold tables, feeds: [climate_comfort],                                  method: cross_catalog,   cadence: daily,     phase: 4, license: Own data,     license_status: verified, url: null}
  - {id: inside_airbnb,          name: Inside Airbnb,              feeds: [stay_prices, reviews],                             method: csv_download,    cadence: quarterly, phase: 4, license: CC BY 4.0,    license_status: verified, url: "https://insideairbnb.com"}
  - {id: terrain_tiles,          name: Open elevation tiles,       feeds: [terrain, elevation_profiles],                      method: tile_read,       cadence: static,    phase: 7, license: TBD,          license_status: verify,   url: null}
  - {id: wikimedia_eventstreams, name: Wikimedia EventStreams,     feeds: [live_pulse],                                       method: sse_stream,      cadence: realtime,  phase: 7, license: CC0,          license_status: verify,   url: "https://stream.wikimedia.org"}
