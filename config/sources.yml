# Odyssey source registry. license_status: verified = license confirmed (see notes for conditions);
# verify = not yet confirmed, must be resolved before the phase that uses it.
sources:
  - {id: wikidata,               name: Wikidata,                     feeds: [countries, destinations, unesco, dishes, festivals], method: sparql,         cadence: weekly,    phase: 1, license: CC0,           license_status: verified, url: "https://query.wikidata.org", notes: "No conditions."}
  - {id: worldbank_indicators,   name: World Bank Indicators,        feeds: [arrivals, receipts, price_levels],                 method: rest_api,       cadence: yearly,    phase: 1, license: CC BY 4.0,     license_status: verified, url: "https://api.worldbank.org/v2", notes: "Attribution required. Replaces UN Tourism as the source for arrivals and receipts."}
  - {id: travel_advisories,      name: German Foreign Office advisories, feeds: [advisory_levels],                          method: rest_api,       cadence: daily,     phase: 1, license: AA OpenData terms, license_status: verified, url: "https://www.auswaertiges-amt.de/opendata", notes: "Show complete and current, clearly attributed. Never LLM-summarized; AI answers mentioning safety carry a warning and link to the original. Register use with the Foreign Office before going live."}
  - {id: ecb_fx,                 name: ECB exchange rates,           feeds: [fx_rates],                                         method: rest_api,       cadence: daily,     phase: 1, license: ESCB reuse policy, license_status: verified, url: "https://data.ecb.europa.eu", notes: "Free reuse; quote 'Source: ECB statistics.'; do not modify the published values."}
  - {id: public_holidays,        name: Python holidays package,      feeds: [holidays],                                         method: python_package, cadence: yearly,    phase: 1, license: MIT,           license_status: verified, url: "https://pypi.org/project/holidays/", notes: "Replaces the Nager.Date API (self-hosted use needs a license key; no clear data license)."}
  - {id: visa_matrix,            name: Passport index dataset,       feeds: [visa_requirements],                                method: git_pull,       cadence: monthly,   phase: 1, license: MIT,           license_status: verified, url: "https://github.com/ilyankou/passport-index-dataset", notes: "Check the latest update date at ingestion; flag stale data on the Trust page."}
  - {id: overture_places,        name: Overture Maps Places,         feeds: [places],                                           method: duckdb_bbox,    cadence: monthly,   phase: 2, license: CDLA-Permissive-2.0 / Apache-2.0 / CC0-1.0, license_status: verified, url: "https://docs.overturemaps.org", notes: "License is per record (sources[] field). Merged with OSM, the derived place layer is published under ODbL."}
  - {id: osm,                    name: OpenStreetMap,                feeds: [places, cuisine_tags],                             method: pbf_extract,    cadence: weekly,    phase: 2, license: ODbL,          license_status: verified, url: "https://download.geofabrik.de", notes: "Attribution '© OpenStreetMap contributors'; derived databases share-alike (ODbL)."}
  - {id: foursquare_os_places,   name: Foursquare Open Source Places, feeds: [places, categories],                          method: hf_gated,       cadence: monthly,   phase: 2, license: Apache-2.0,    license_status: verified, url: "https://huggingface.co/datasets/foursquare/fsq-os-places", notes: "Attribution required. Gated on Hugging Face: needs an account and token."}
  - {id: wikivoyage,             name: Wikivoyage,                   feeds: [guide_text, culture_cards],                        method: dump_parse,     cadence: monthly,   phase: 3, license: CC BY-SA,      license_status: verified, url: "https://dumps.wikimedia.org", notes: "Attribution and share-alike for derived text."}
  - {id: osm_hiking_routes,      name: OSM hiking routes,            feeds: [treks],                                            method: pbf_extract,    cadence: weekly,    phase: 3, license: ODbL,          license_status: verified, url: "https://hiking.waymarkedtrails.org", notes: "Same terms as OSM."}
  - {id: wikipedia_pageviews,    name: Wikipedia pageviews,          feeds: [interest, crowd_seasonality],                      method: rest_api,       cadence: daily,     phase: 4, license: CC0,           license_status: verified, url: "https://wikimedia.org/api/rest_v1", notes: "Send a descriptive User-Agent."}
  - {id: aurora_climate,         name: Aurora climate gold tables,   feeds: [climate_comfort],                                  method: cross_catalog,  cadence: daily,     phase: 4, license: Own data,      license_status: verified, url: null, notes: "Upstream data product from the Aurora platform."}
  - {id: inside_airbnb,          name: Inside Airbnb,                feeds: [stay_prices, reviews],                             method: csv_download,   cadence: quarterly, phase: 4, license: CC BY 4.0,     license_status: verified, url: "https://insideairbnb.com", notes: "Attribution required."}
  - {id: terrain_tiles,          name: AWS Terrain Tiles,            feeds: [terrain, elevation_profiles],                      method: tile_read,      cadence: static,    phase: 7, license: Attribution (Tilezen/joerd), license_status: verified, url: "https://registry.opendata.aws/terrain-tiles", notes: "Attribution required for analysis and display, per the joerd attribution list."}
  - {id: wikimedia_eventstreams, name: Wikimedia EventStreams,       feeds: [live_pulse],                                       method: sse_stream,     cadence: realtime,  phase: 7, license: TBD,           license_status: verify,   url: "https://stream.wikimedia.org", notes: "Deferred: resolve before Phase 7."}
