resources:
  jobs:
    odyssey_monthly:
      name: odyssey-monthly
      schedule:
        quartz_cron_expression: "0 0 4 1 * ?"
        timezone_id: Europe/Berlin
      email_notifications:
        on_failure: ["${workspace.current_user.userName}"]
      tasks:
        - task_key: ingest_notable_places
          notebook_task:
            notebook_path: ../jobs/ingest_notable_places.py
            base_parameters: {catalog: "${var.catalog}"}
        - task_key: ingest_overture
          notebook_task:
            notebook_path: ../jobs/ingest_overture.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: ingest_foursquare
          notebook_task:
            notebook_path: ../jobs/ingest_foursquare.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: bronze_places
          depends_on: [{task_key: ingest_overture}, {task_key: ingest_foursquare}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze_places.id}
