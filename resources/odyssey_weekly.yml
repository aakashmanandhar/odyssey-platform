resources:
  jobs:
    odyssey_weekly:
      name: odyssey-weekly
      schedule:
        quartz_cron_expression: "0 0 5 ? * MON"
        timezone_id: Europe/Berlin
      email_notifications:
        on_failure: ["${workspace.current_user.userName}"]
      environments:
        - environment_key: dbt
          spec:
            environment_version: "2"
            dependencies: ["dbt-databricks~=1.10"]
      tasks:
        - task_key: ingest_reference
          notebook_task:
            notebook_path: ../jobs/ingest_reference.py
            base_parameters: {catalog: "${var.catalog}"}
        - task_key: ingest_worldbank
          notebook_task:
            notebook_path: ../jobs/ingest_worldbank.py
            base_parameters: {catalog: "${var.catalog}"}
        - task_key: ingest_holidays
          notebook_task:
            notebook_path: ../jobs/ingest_holidays.py
            base_parameters: {catalog: "${var.catalog}"}
        - task_key: ingest_visa
          notebook_task:
            notebook_path: ../jobs/ingest_visa.py
            base_parameters: {catalog: "${var.catalog}"}
        - task_key: ingest_advisories
          notebook_task:
            notebook_path: ../jobs/ingest_advisories.py
            base_parameters: {catalog: "${var.catalog}"}
        - task_key: ingest_images
          notebook_task:
            notebook_path: ../jobs/ingest_images.py
            base_parameters: {catalog: "${var.catalog}"}
        - task_key: ingest_notable_places
          notebook_task:
            notebook_path: ../jobs/ingest_notable_places.py
            base_parameters: {catalog: "${var.catalog}"}
        - task_key: ingest_fx
          notebook_task:
            notebook_path: ../jobs/ingest_fx.py
            base_parameters: {catalog: "${var.catalog}"}
        - task_key: dbt_build
          depends_on:
            - {task_key: ingest_reference}
            - {task_key: ingest_worldbank}
            - {task_key: ingest_holidays}
            - {task_key: ingest_visa}
            - {task_key: ingest_advisories}
            - {task_key: ingest_fx}
            - {task_key: ingest_notable_places}
            - {task_key: ingest_images}
          environment_key: dbt
          dbt_task:
            project_directory: ../transform
            catalog: ${var.catalog}
            schema: silver
            warehouse_id: ${var.warehouse_id}
            commands:
              - "dbt build --exclude tag:after_ml"
              - "dbt source freshness"
        - task_key: train_place_matcher
          depends_on: [{task_key: dbt_build}]
          notebook_task:
            notebook_path: ../ml/train_place_matcher.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: dbt_build_places
          depends_on: [{task_key: train_place_matcher}]
          environment_key: dbt
          dbt_task:
            project_directory: ../transform
            catalog: ${var.catalog}
            schema: silver
            warehouse_id: ${var.warehouse_id}
            commands:
              - "dbt build --select tag:after_ml"
