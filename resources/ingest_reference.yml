resources:
  jobs:
    ingest_reference:
      name: odyssey-ingest-reference
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../jobs/ingest_reference.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: ingest_worldbank
          notebook_task:
            notebook_path: ../jobs/ingest_worldbank.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: ingest_holidays
          notebook_task:
            notebook_path: ../jobs/ingest_holidays.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: ingest_visa
          notebook_task:
            notebook_path: ../jobs/ingest_visa.py
            base_parameters:
              catalog: ${var.catalog}
