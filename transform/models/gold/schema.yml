version: 2

models:
  - name: dim_date
    description: "Calendar dimension, one row per day (2000-01-01 to 2030-12-31)."
    columns:
      - name: date_key
        data_tests: [unique, not_null]
      - name: date_day
        data_tests: [unique, not_null]

  - name: dim_month
    description: "The 12 calendar months with quarter and hemisphere seasons."
    columns:
      - name: month
        data_tests: [unique, not_null]
      - name: season_north
        data_tests:
          - accepted_values:
              arguments:
                values: ["winter", "spring", "summer", "autumn"]

  - name: dim_source
    description: "Source registry from config/sources.yml: license, cadence and phase per source."
    columns:
      - name: source_id
        data_tests: [unique, not_null]
      - name: license_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["verified", "verify"]

  - name: dim_country
    description: "Pilot countries with Wikidata facts. Must be complete for all configured countries."
    columns:
      - name: country_key
        data_tests: [unique, not_null]
      - name: capital
        data_tests: [not_null]
      - name: population
        data_tests: [not_null]
      - name: area_km2
        data_tests: [not_null]
      - name: lat
        data_tests: [not_null]

  - name: dim_destination
    description: "Destinations listed on Wikivoyage country pages (Cities, Other destinations), with Wikidata details."
    columns:
      - name: destination_key
        data_tests: [unique, not_null]
      - name: country_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_key
      - name: kind
        data_tests:
          - accepted_values:
              arguments:
                values: ["city", "other_destination"]
      - name: name
        data_tests: [not_null]
      - name: lat
        data_tests: [not_null]
      - name: lon
        data_tests: [not_null]

  - name: fact_tourism_country_year
    description: "One row per country and year: World Bank tourism, population and price data with derived metrics."
    columns:
      - name: country_year_key
        data_tests: [unique, not_null]
      - name: country_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_key
      - name: year_start_date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

  - name: fact_advisory
    description: "SCD2 travel advisory history for pilot countries (German Foreign Office). Shown complete and attributed, never LLM-summarized (ADR-003)."
    columns:
      - name: advisory_version_key
        data_tests: [unique, not_null]
      - name: country_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_key

  - name: fact_fx_rate_daily
    description: "ECB euro reference rates per currency and day (units per 1 EUR)."
    columns:
      - name: currency_date_key
        data_tests: [unique, not_null]

  - name: dim_currency
    description: "Latest rate per EUR for every currency Odyssey needs, with the basis of each rate."
    columns:
      - name: currency_key
        data_tests: [unique, not_null]
      - name: rate_per_eur
        data_tests: [not_null]
      - name: rate_basis
        data_tests: [not_null]

  - name: fact_public_holiday
    description: "National public holidays per pilot country and date."
    columns:
      - name: country_holiday_key
        data_tests: [unique, not_null]
      - name: date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

  - name: fact_visa_requirement
    description: "Visa requirement per passport for each pilot destination (passport-index dataset, MIT)."
    columns:
      - name: passport_destination_key
        data_tests: [unique, not_null]
      - name: requirement_category
        data_tests:
          - accepted_values:
              arguments:
                values: ["visa_free", "visa_on_arrival", "eta", "e_visa", "visa_required", "no_admission", "own_country"]
