version: 2

sources:
  - name: bronze
    schema: bronze
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 8, period: day}
        error_after: {count: 15, period: day}
    tables:
      - name: wikidata_raw
        description: "Raw Wikidata SPARQL responses, one row per (query, country, batch)."
      - name: wikivoyage_raw
        description: "Raw Wikivoyage API responses, one row per (query, country, batch)."
      - name: worldbank_raw
        description: "Raw World Bank indicator responses, one row per (indicator, batch), all pilot countries."
      - name: advisories_raw
        description: "Raw German Foreign Office travel advisory list (all countries), one row per daily batch."
        config:
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 4, period: day}
      - name: fx_raw
        description: "Raw ECB reference-rate CSV batches (backfill and incremental windows)."
        config:
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 4, period: day}
      - name: holidays_raw
        description: "Public holidays generated by the holidays package, one row per (country, batch), with package version."
      - name: images_raw
        description: "Raw Wikidata (P18/P948) and Wikimedia Commons imageinfo responses for destination photos."
      - name: notable_places_raw
        description: "Raw Wikipedia geosearch responses (articles near destinations) and Commons imageinfo for their photos; refreshed monthly."
        config:
          freshness: null
      - name: wikidata_types_raw
        description: "Raw Wikidata SPARQL responses: instance-of, country and superclass chains for notable places (ADR-020)."
        config:
          freshness: null
      - name: climate_raw
        description: "NASA POWER climatology responses: 2001-2025 monthly means per destination; refreshed monthly."
        config:
          freshness: null
      - name: climate_worldclim_raw
        description: "WorldClim 2.1 monthly normals (1970-2000, ~4.5 km) sampled per destination: tmax, tmin (C), prec (mm/month)."
        config:
          freshness: null
      - name: visa_raw
        description: "Passport-index tidy ISO3 CSV, pinned to a commit; one row per batch."
      - name: overture_places
        description: "Overture places from the bronze declarative pipeline (Auto Loader), with lineage."
        config:
          freshness:
            warn_after: {count: 35, period: day}
            error_after: {count: 45, period: day}
      - name: foursquare_places
        description: "Foursquare OS Places from the bronze declarative pipeline (Auto Loader), with lineage."
        config:
          freshness:
            warn_after: {count: 35, period: day}
            error_after: {count: 45, period: day}
  - name: ml
    schema: ml
    tables:
      - name: er_pair_scores
        description: "Match scores for every candidate pair, written by the place-matcher training notebook."
