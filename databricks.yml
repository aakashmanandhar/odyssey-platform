bundle:
  name: odyssey

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog used by this target

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: odyssey
    variables:
      catalog: odyssey_dev

  prod:
    mode: production
    workspace:
      profile: odyssey
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: odyssey
