bundle:
  name: odyssey

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog used by this target
  warehouse_id:
    description: SQL warehouse that runs dbt
    default: 7b6370e08ed8e9c0

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-6ae801ba-74ba.cloud.databricks.com
    variables:
      catalog: odyssey_dev

  prod:
    mode: production
    workspace:
      host: https://dbc-6ae801ba-74ba.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: odyssey
