name: odyssey-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: odyssey-${{ github.ref }}
  cancel-in-progress: false

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate config
        run: |
          pip install pyyaml
          python tests/validate_config.py
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format and validate
        run: |
          terraform -chdir=infra/terraform/databricks fmt -check
          terraform -chdir=infra/terraform/databricks init -backend=false
          terraform -chdir=infra/terraform/databricks validate
      - uses: databricks/setup-cli@main
      - name: Validate bundle (dev and prod)
        run: |
          databricks bundle validate -t dev
          databricks bundle validate -t prod

  deploy-dev:
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: databricks/setup-cli@main
      - name: Deploy to dev and run heartbeat
        run: |
          databricks bundle deploy -t dev
          databricks bundle run -t dev platform_heartbeat

  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v5
      - uses: databricks/setup-cli@main
      - name: Deploy to prod and run heartbeat
        run: |
          databricks bundle deploy -t prod
          databricks bundle run -t prod platform_heartbeat
