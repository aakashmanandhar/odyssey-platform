name: odyssey-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: odyssey-${{ github.ref }}
  cancel-in-progress: false

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate config and check seeds are in sync
        run: |
          pip install pyyaml
          python tests/validate_config.py
          python config/build_seeds.py
          git diff --exit-code transform/seeds || (echo "Seeds are out of date: run config/build_seeds.py and commit" && exit 1)
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format and validate
        run: |
          terraform -chdir=infra/terraform/databricks fmt -check
          terraform -chdir=infra/terraform/databricks init -backend=false
          terraform -chdir=infra/terraform/databricks validate
      - uses: databricks/setup-cli@main
      - name: Validate bundle (dev and prod)
        run: |
          databricks bundle validate -t dev
          databricks bundle validate -t prod

  deploy-dev:
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: databricks/setup-cli@main
      - name: Deploy to dev and run heartbeat
        run: |
          databricks bundle deploy -t dev
          databricks bundle run -t dev platform_heartbeat
          databricks bundle run -t dev ingest_reference
          databricks bundle run -t dev ingest_advisories
      - name: dbt build (dev)
        run: |
          pip install "dbt-databricks~=1.10"
          export DATABRICKS_HOST="${DATABRICKS_HOST#https://}"
          DBT_TARGET=dev dbt build --project-dir transform --profiles-dir transform

  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: databricks/setup-cli@main
      - name: Deploy to prod and run heartbeat
        run: |
          databricks bundle deploy -t prod
          databricks bundle run -t prod platform_heartbeat
          databricks bundle run -t prod ingest_reference
          databricks bundle run -t prod ingest_advisories
      - name: dbt build (prod)
        run: |
          pip install "dbt-databricks~=1.10"
          export DATABRICKS_HOST="${DATABRICKS_HOST#https://}"
          DBT_TARGET=prod dbt build --project-dir transform --profiles-dir transform
