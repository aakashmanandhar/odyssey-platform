# Odyssey web container. The host nginx forwards /odyssey/ here; /srv/odyssey is mounted read-only.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    location = /odyssey { return 301 /odyssey/; }

    # Data snapshot: always revalidated, so a new sync shows up on the next page load
    location /odyssey/data/ {
        alias /srv/odyssey/current/;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Photos: content never changes for a given id, so cache for a week
    location /odyssey/img/ {
        alias /srv/odyssey/images/;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Built JS/CSS/fonts have content hashes in their names: cache for a year
    location /odyssey/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The app itself: any page path returns index.html so links like /odyssey/d/Q3037 work
    location /odyssey/ {
        try_files $uri /odyssey/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
